<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Devine ! – Quiz d'images minimalistes</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --yellow: #ffd60a;
    --black: #0a0a0a;
    --grey: #1c1c1c;
    --white: #f5f5f5;
    --red: #ff5252;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html {
    background: var(--black);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  #app {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo { height: 120px; width: auto; border-radius: 14px; margin-bottom: 4px; }
  h1 { color: var(--yellow); font-size: 2rem; font-weight: 800; letter-spacing: .05em; margin: 8px 0 8px; }
  h2 { color: var(--yellow); font-size: 1.05rem; font-weight: 600; margin: 26px 0 12px; }
  .result { font-size: 1.15rem; font-weight: 700; margin: 12px 0 0; }
  .hint { color: rgba(245,245,245,.7); font-size: .9rem; }

  /* Catégories */
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .cat {
    font: inherit; background: none; border: 0; padding: 0; color: var(--white);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .cat .box {
    width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.8rem, 9vw, 2.6rem);
    background: var(--grey); border: 1px solid rgba(245,245,245,.3); border-radius: 16px;
  }
  .cat span { font-size: .8rem; }
  .cat[aria-pressed="true"] .box { border: 3px solid var(--yellow); }
  .cat[aria-pressed="true"] span { color: var(--yellow); font-weight: 700; }

  /* Boutons */
  .btn {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px;
    min-height: 48px; padding: 12px 28px; cursor: pointer;
  }
  .btn.primary { background: var(--yellow); color: #000; }
  .btn.start { margin-top: 32px; font-size: 1.1rem; }
  .btn:disabled { cursor: default; }
  .link { font: inherit; background: none; border: 0; color: var(--white); cursor: pointer; padding: 8px 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }

  /* Jeu */
  .top { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 12px; }
  .score { color: var(--yellow); font-weight: 700; }
  .errs { font-size: 1.1rem; letter-spacing: .1em; min-width: 64px; text-align: right; }
  .card {
    background: #fff; border: 3px solid var(--yellow); border-radius: 16px; padding: 8px;
    width: min(240px, 62vw); aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .card img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .missing { color: #333; font-size: .85rem; word-break: break-all; margin: 0; }
  .fbwrap { min-height: 3.2em; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; margin: 12px 0 4px; }
  .fb { margin: 0; font-weight: 700; }
  .fb.good { color: var(--yellow); }
  .fb.bad { color: var(--red); }
  .text { width: 100%; }
  .text input {
    font: inherit; font-size: 16px; width: 100%; background: transparent; color: var(--white);
    border: 1px solid rgba(245,245,245,.4); border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  .text input:focus { border-color: var(--yellow); }
  .text input.locked { opacity: .7; }
  .tagline { color: rgba(245,245,245,.85); font-size: 1.05rem; margin: 0 0 4px; }
  .intro {
    width: 100%; text-align: left; margin-top: 18px; padding: 14px 16px;
    background: var(--grey); border: 1px solid rgba(245,245,245,.2);
    border-left: 4px solid var(--yellow); border-radius: 12px;
  }
  .intro p { margin: 0 0 8px; line-height: 1.5; }
  .intro p:last-child { margin-bottom: 0; }
  .next { margin-top: 14px; }
</style>
</head>
<body>
<div id="app"><p class="hint">Chargement…</p></div>

<script>
const app = document.getElementById('app');

const CATS = [
  { key: null,         label: 'Tout',       emoji: '🍿' },
  { key: 'film',       label: 'Film',       emoji: '🎬' },
  { key: 'serie',      label: 'Série',      emoji: '📺' },
  { key: 'jeux_video', label: 'Jeux vidéo', emoji: '🎮' },
];
const KNOWN = ['film', 'serie', 'jeux_video'];

// ----- Textes de l'écran d'accueil (modifie-les librement) -----
const TAGLINE = 'Reconnais-les en une seule image !';
const INTRO = [
  'Des films, des séries et des jeux vidéo ont été réduits à une image minimaliste. À toi de retrouver leur titre !',
  'Choisis une catégorie, puis tape ta réponse : les accents, les majuscules et la ponctuation n\u2019ont pas d\u2019importance.',
];

// Nombre d'erreurs permises PAR IMAGE : une fois atteint, la réponse est dévoilée
// et on passe à l'image suivante (2 = deux essais par image).
const MAX_ERREURS = 2;

let allItems = [];
let homeMsg = '';
const sel = { category: null };
let g = null; // partie en cours

/* ---------- Outils ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid);
  }
  return el;
}

// Remplace le contenu de la page (ignore les éléments null)
function show(...nodes) {
  app.replaceChildren(...nodes.flat().filter(Boolean));
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Ignore accents, majuscules, ponctuation et espaces ("X-Men" = "x men" = "xmen")
function norm(s) {
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
}

function catKey(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().trim().replace(/[\s-]+/g, '_');
}

/* ---------- Chargement ---------- */
async function init() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('data.json introuvable (HTTP ' + res.status + ')');
    const data = await res.json();
    allItems = data
      .map(o => {
        let c = catKey(o.category);
        if (!KNOWN.includes(c)) c = 'film';
        return { file: o.file, title: o.title, category: c };
      })
      .filter(i => i.file && i.title);
    renderHome();
  } catch (e) {
    renderError(e);
  }
}

/* ---------- Logique de jeu ---------- */
function start() {
  const pool = allItems.filter(i => sel.category === null || i.category === sel.category);
  if (!pool.length) {
    homeMsg = 'Aucune image dans cette catégorie pour le moment.';
    renderHome();
    return;
  }
  homeMsg = '';
  g = { queue: shuffle(pool), n: pool.length, score: 0,
        current: null, errors: 0, answered: false, correct: false, picked: null, lastTry: '' };
  nextQuestion();
}

function nextQuestion() {
  g.current = g.queue.shift();
  g.errors = 0;          // les erreurs sont comptées image par image
  g.answered = false;
  g.correct = false;
  g.picked = null;
  g.lastTry = '';
  window.scrollTo(0, 0);
  renderGame();
}

function answer(value) {
  if (g.answered) return;
  if (norm(value) === norm(g.current.title)) {
    g.correct = true;
    g.answered = true;
    g.picked = value;
    g.score++;
  } else {
    g.errors++;
    g.lastTry = value;
    if (g.errors >= MAX_ERREURS) {   // trop d'erreurs : on dévoile la réponse
      g.answered = true;
      g.picked = value;
    }
  }
  renderGame();
}

// Question suivante, ou fin de partie s'il n'y en a plus
function goNext() {
  if (!g.queue.length) finish();
  else nextQuestion();
}

function finish() {
  homeMsg = '🏁 Partie terminée ! Score : ' + g.score + ' / ' + g.n;
  g = null;
  renderHome();
}

/* ---------- Écrans ---------- */
function renderHome() {
  show(
    h('img', { class: 'logo', src: 'logo.png', alt: '' }),
    h('h1', {}, 'DEVINE !'),
    h('p', { class: 'tagline' }, TAGLINE),
    homeMsg ? h('p', { class: 'result' }, homeMsg) : null,

    h('div', { class: 'intro' },
      INTRO.map(t => h('p', {}, t)),
      h('p', {},
        'Pour chaque image, tu as droit à ' + MAX_ERREURS + (MAX_ERREURS > 1 ? ' erreurs' : ' erreur') +
        ' (' + '❤️'.repeat(MAX_ERREURS) + ') : ensuite, la réponse t\u2019est dévoilée. Bonne chance !')),

    h('h2', {}, 'Catégorie'),
    h('div', { class: 'cats' }, CATS.map(c =>
      h('button', {
        class: 'cat',
        'aria-pressed': String(sel.category === c.key),
        onclick: () => { sel.category = c.key; renderHome(); },
      },
        h('div', { class: 'box' }, c.emoji),
        h('span', {}, c.label))
    )),

    h('button', { class: 'btn primary start', onclick: start }, 'ACTION !')
  );
}

function renderGame() {
  const it = g.current;
  const left = Math.max(0, MAX_ERREURS - g.errors);   // essais restants pour cette image

  const img = h('img', { src: 'images/' + encodeURIComponent(it.file), alt: 'Image à deviner' });
  img.addEventListener('error', () => {
    img.replaceWith(h('p', { class: 'missing' }, 'Image introuvable : ' + it.file));
  });

  const input = h('input', {
    type: 'text', placeholder: 'Ta réponse', autocomplete: 'off',
    autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
    class: g.answered ? 'locked' : null,
    'aria-label': 'Ta réponse',
    value: g.answered ? g.picked : g.lastTry,
  });
  const submit = () => { if (input.value.trim()) answer(input.value); };
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.repeat) return;
    e.preventDefault();
    if (g.answered) goNext(); else submit();
  });
  // Une fois l'image terminée, le champ ne peut plus être modifié
  input.addEventListener('input', () => { if (g.answered) input.value = g.picked; });

  const body = h('div', { class: 'text' },
    input,
    g.answered ? null : h('button', { class: 'btn primary', onclick: submit }, 'Valider'));

  let fb = [];
  if (g.answered) {
    fb = [g.correct
      ? h('p', { class: 'fb good' }, '✅ Bonne réponse !')
      : h('p', { class: 'fb bad' }, '❌ Raté ! C\u2019était : ' + it.title)];
  } else if (g.errors > 0) {
    fb = [h('p', { class: 'fb bad' },
      '❌ Raté ! Il te reste ' + left + (left > 1 ? ' essais.' : ' essai.'))];
  }

  const next = g.answered
    ? h('button', { class: 'btn primary next', onclick: goNext },
        g.queue.length ? 'Suivant' : 'Voir le score')
    : null;

  show(
    h('div', { class: 'top' },
      h('button', { class: 'link', onclick: () => { g = null; homeMsg = ''; renderHome(); } }, '← Menu'),
      h('span', { class: 'score' }, 'Score : ' + g.score + ' / ' + g.n),
      h('span', { class: 'errs', 'aria-label': 'Essais restants pour cette image : ' + left },
        '❤️'.repeat(left) + '🖤'.repeat(MAX_ERREURS - left))),
    h('div', { class: 'card' }, img),
    h('div', { class: 'fbwrap' }, fb),
    body,
    next
  );

  input.focus();
  if (!g.answered && g.lastTry) input.select();   // on peut corriger ou retaper directement
  if (next) next.scrollIntoView({ block: 'nearest' });
}

function renderError(e) {
  show(
    h('h1', {}, 'Oups'),
    h('p', {}, 'Impossible de charger la liste des images (data.json).'),
    h('p', { class: 'hint' },
      'Si tu as ouvert index.html directement depuis ton ordinateur, c\u2019est normal : ' +
      'le jeu doit être ouvert via un site (GitHub Pages) ou un serveur local.'),
    h('p', { class: 'hint' }, String(e && e.message ? e.message : e))
  );
}

init();
</script>
</body>
</html>
